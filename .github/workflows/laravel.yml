# Updated for the ccdt/ layout, PHP 8.2 and MySQL 8 during the lw_working_branch
# merge. Not yet run on GitHub Actions; expect to adjust after the first run.
name: Laravel

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpw
          MYSQL_DATABASE: css_testing
          MYSQL_USER: user
          MYSQL_PASSWORD: circleci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prootpw"
          --health-interval=10s --health-timeout=5s --health-retries=10
      tika:
        image: logicalspark/docker-tikaserver
        ports:
          - 9998:9998

    defaults:
      run:
        working-directory: ccdt

    steps:
    - uses: actions/checkout@v4
    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, pdo_mysql, zip
    - name: Copy .env
      run: cp ../env/.env.circleci .env
    - name: Install Dependencies
      run: composer install -q --no-ansi --no-interaction --no-progress --prefer-dist
    - name: Generate key
      run: php artisan key:generate
    - name: Directory Permissions
      run: |
        mkdir -p storage/app/exports
        chmod -R 777 storage bootstrap/cache
    - name: Migrate
      run: php artisan migrate --force
    - name: Execute tests
      run: vendor/bin/phpunit
