# NOTE: updated for the ccdt/ layout, PHP 8.2 and MySQL 8 when lw_working_branch
# was merged into main. This file has not been run on CircleCI yet; expect to
# adjust it after the first build.
version: 2.1
jobs:
  build:
    docker:
      - image: cimg/php:8.2-node
      - image: cimg/mysql:8.0
        environment:
          MYSQL_ROOT_PASSWORD: rootpw
          MYSQL_DATABASE: css_testing
          MYSQL_USER: user
          MYSQL_PASSWORD: circleci
      - image: logicalspark/docker-tikaserver
        ports:
          - "9998:9998"

    working_directory: ~/laravel/ccdt

    steps:
      - checkout:
          path: ~/laravel

      - run:
          name: Copy .env.circleci to .env
          command: cp ~/laravel/env/.env.circleci .env

      - run:
          name: Create exports folder
          command: mkdir -p ~/laravel/ccdt/storage/app/exports

      - run:
          name: Install system packages and PHP extensions
          command: |
            sudo apt-get update
            sudo apt-get install -y default-mysql-client libzip-dev
            sudo docker-php-ext-install zip pdo_mysql || true

      - run:
          name: Install Xdebug (coverage) if missing
          command: |
            php -m | grep -qi xdebug || sudo pecl install xdebug || true

      - run: sudo composer self-update

      - restore_cache:
          keys:
            - composer-v2-{{ checksum "composer.lock" }}
            - composer-v2-

      - run: composer install -n --prefer-dist

      - save_cache:
          key: composer-v2-{{ checksum "composer.lock" }}
          paths:
            - vendor

      - run:
          name: Wait for database
          command: dockerize -wait tcp://localhost:3306 -timeout 2m

      - run: php artisan key:generate
      - run: php artisan config:cache
      - run: php artisan migrate --force

      - run:
          name: Run tests with coverage
          command: sudo XDEBUG_MODE=coverage vendor/bin/phpunit --coverage-clover clover.xml

      - run:
          name: Install Qlty
          command: |
            curl -fsSL https://qlty.sh | bash
            echo 'export PATH="$HOME/.qlty/bin:$PATH"' >> "$BASH_ENV"

      - run:
          name: Publish coverage to Qlty
          command: qlty coverage publish --strip-prefix /home/circleci/laravel/ccdt/ clover.xml
